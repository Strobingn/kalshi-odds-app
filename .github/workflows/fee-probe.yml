name: Fee probe (Claude)

# Reads Kalshi's public, unauthenticated API (tools/research/fee_probe.py) to
# report the fee_type / fee_multiplier, scheduled fee changes, event fee
# overrides and liquidity-incentive programs for KXBTC15M, KXETH15M, KXSOL15M
# and KXBTCD. Read-only: no orders, nothing committed or released.

on:
  push:
    branches: [Claude]
    paths:
      - "tools/research/fee_probe.py"
      - "tools/research/test_fee_probe.py"
      - "tools/research/fixtures/fee_probe/**"
      - ".github/workflows/fee-probe.yml"
  workflow_dispatch:
    inputs:
      series:
        description: Comma-separated series tickers
        required: false
        default: "KXBTC15M,KXETH15M,KXSOL15M,KXBTCD"

permissions:
  contents: read

concurrency:
  group: fee-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 tools/research/test_fee_probe.py

      - name: Probe
        env:
          SERIES: ${{ github.event.inputs.series || 'KXBTC15M,KXETH15M,KXSOL15M,KXBTCD' }}
        run: |
          echo "===== FEE PROBE ====="
          set +e
          python3 tools/research/fee_probe.py --series "$SERIES" --json fee_probe.json | tee fee_probe.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "===== END FEE PROBE ====="
          { echo '```'; cat fee_probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fee-probe-${{ github.run_number }}
          path: |
            fee_probe.json
            fee_probe.txt
          if-no-files-found: ignore
