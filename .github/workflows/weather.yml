name: Weather markets (Claude)

# Kalshi daily high-temperature markets (read-only research, no orders):
#   tools/research/weather_study.py  historical calibration of settled markets
#   tools/research/weather_scan.py   live "decided-but-still-open" bucket scanner
# Reports are printed to the log between markers and added to the run summary.
# Schedules only run on the default branch, so this runs on push to Claude and
# on manual dispatch (dispatch late in the US afternoon/evening for the scan).

on:
  push:
    branches: [Claude]
    paths:
      - "tools/research/weather_*.py"
      - "tools/research/test_weather.py"
      - "tools/research/fixtures/weather/**"
      - ".github/workflows/weather.yml"
  workflow_dispatch:
    inputs:
      days:
        description: Study lookback days of settled markets
        required: false
        default: "45"
      repeat:
        description: Scan snapshots
        required: false
        default: "6"
      interval:
        description: Seconds between scan snapshot starts
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: weather-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (fixtures, no network)
        run: python3 tools/research/test_weather.py

      - name: Study (settled markets)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          python3 tools/research/weather_study.py \
            --days "${{ github.event.inputs.days || '45' }}" --budget 1800 \
            --out weather_study.md > /dev/null

      - name: Print study
        if: always()
        run: |
          echo "===== WEATHER STUDY ====="
          cat weather_study.md 2>/dev/null || echo "(no study report written)"
          echo "===== END WEATHER STUDY ====="
          if [ -f weather_study.md ]; then cat weather_study.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Scan (live)
        if: always()
        continue-on-error: true
        timeout-minutes: 45
        run: |
          python3 tools/research/weather_scan.py \
            --repeat "${{ github.event.inputs.repeat || '6' }}" \
            --interval "${{ github.event.inputs.interval || '300' }}" \
            --out weather_scan.md --json weather_scan.json > /dev/null

      - name: Print scan
        if: always()
        run: |
          echo "===== WEATHER SCAN ====="
          cat weather_scan.md 2>/dev/null || echo "(no scan report written)"
          echo "===== END WEATHER SCAN ====="
          if [ -f weather_scan.md ]; then cat weather_scan.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-${{ github.run_number }}
          path: |
            weather_study.md
            weather_scan.md
            weather_scan.json
          if-no-files-found: ignore
