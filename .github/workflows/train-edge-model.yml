name: Train models

# Publishes the rolling `grok-bitcoin-edge-model` release. The app downloads
# that tag (SignalConstants.EDGE_MODEL_RELEASE_TAG). Never write
# `edge-model-latest` (main app) or `claude-edge-model`.
#
# Trains every model this repo can fit without a paid API:
#   - offset logistic (the model Settings → Get latest model installs)
#   - plain logistic (same release, logistic_model.json, not auto-activated)
# Heavy student and the TFLite net stay as the copies already in the APK.
# They need a history CSV / TensorFlow and are not refit here.
#
# Uses only public Kalshi + Coinbase data and GitHub-hosted runners.

on:
  workflow_dispatch:
    inputs:
      days:
        description: Lookback days for settled Kalshi 15m markets
        required: false
        default: "30"
  push:
    branches: [grok-bitcoin]
    paths:
      - "ml/**"
      - ".github/workflows/train-edge-model.yml"

permissions:
  contents: write

env:
  RELEASE_TAG: grok-bitcoin-edge-model

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trainer tests (no look-ahead, offset model)
        run: python3 ml/test_train_edge.py
      - name: Train offset model
        run: |
          python3 ml/train_edge.py \
            --days ${{ github.event.inputs.days || '30' }} \
            --kind offset_logistic \
            --tag "$RELEASE_TAG" \
            --require-live \
            --out ml/edge_model.json \
            --manifest ml/edge_model_manifest.json
      - name: Train logistic model
        run: |
          python3 ml/train_edge.py \
            --days ${{ github.event.inputs.days || '30' }} \
            --kind logistic \
            --tag grok-bitcoin-logistic-model \
            --require-live \
            --out ml/logistic_model.json \
            --manifest ml/logistic_manifest.json
      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: grok-bitcoin-models
          path: |
            ml/edge_model.json
            ml/edge_model_manifest.json
            ml/logistic_model.json
            ml/logistic_manifest.json
            ml/parity_sample.last.json
          if-no-files-found: error
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "grok-bitcoin-edge-model"
          NOTES=$(python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("ml/edge_model_manifest.json")
          m = json.loads(p.read_text()) if p.is_file() else {}
          print(
              "grok-bitcoin models (public data only)\\n\\n"
              "Offset logistic is what the app installs. Logistic is attached and not auto-activated.\\n\\n"
              f"- version: {m.get('version')}\\n"
              f"- trained_at: {m.get('trained_at')}\\n"
              f"- n_holdout: {m.get('n_samples')}\\n"
              f"- model_brier: {m.get('model_brier')} vs market {m.get('market_brier')}\\n"
              f"- model_logloss: {m.get('model_logloss')} vs market {m.get('market_logloss')}\\n"
              f"- sim EV-at-ask trades: {m.get('sim_trades')}, P&L/contract sum: {m.get('sim_pnl')}\\n"
              f"- beats_market: {m.get('beats_market')}"
          )
          PY
          )
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            ml/edge_model.json \
            ml/edge_model_manifest.json \
            ml/logistic_model.json \
            ml/logistic_manifest.json \
            --target "$GITHUB_SHA" \
            --title "grok-bitcoin models" \
            --notes "$NOTES"
