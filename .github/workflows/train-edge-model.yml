name: Train edge model

on:
  schedule:
    # Daily 08:17 UTC — retrain on fresh settled Kalshi BTC/ETH/SOL 15m data.
    # GitHub Actions schedules fire only from the repository default branch.
    # This file is on kashi, so the cron does not run while the default
    # branch is main. workflow_dispatch on this branch still works.
    # Until then, run `python3 ml/publish_daily.py --github` locally.
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Lookback days for settled Kalshi 15m markets (0 = full history)
        required: false
        default: "3650"

# A failed step skips later steps (GitHub Actions default). Publish only runs
# after the trainer exits 0, which requires the publish gates to pass.
# https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow
permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trainer tests (no look-ahead + publish safety)
        run: python3 ml/test_train_edge.py && python3 ml/test_publish_model.py
      - name: Train
        id: train
        run: python3 ml/train_edge.py --days ${{ github.event.inputs.days || '3650' }} --series KXBTC15M,KXETH15M,KXSOL15M --out ml/edge_model.json --manifest ml/edge_model_manifest.json
      - name: Refuse publish unless gates pass
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "ml")
          import publish_gates as gates
          p = Path("ml/edge_model_manifest.json")
          if not p.is_file():
              print("no manifest — refusing publish")
              sys.exit(1)
          m = json.loads(p.read_text())
          d = gates.publish_decision(m)
          print(json.dumps(d, indent=2))
          if not d["publishable"]:
              print("gates failed — not publishing")
              sys.exit(1)
          PY
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: edge-model-json
          path: |
            ml/edge_model.json
            ml/edge_model_manifest.json
            ml/fixtures/parity_sample.json
          if-no-files-found: error
      - name: Publish model-YYYYMMDD only if beat_market
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ml/publish_model.py --github --model ml/edge_model.json --manifest ml/edge_model_manifest.json
