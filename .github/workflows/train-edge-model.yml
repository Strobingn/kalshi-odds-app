name: Train edge model

on:
  # Run this workflow on chat-GTP for a branch-only model release. GitHub
  # schedules run the default branch and would use main's trainer instead.
  push:
    branches: [chat-GTP]
    paths:
      - '.github/workflows/train-edge-model.yml'
      - 'ml/train_edge.py'
      - 'ml/test_train_edge.py'
      - 'ml/fixtures/**'
  workflow_dispatch:
    inputs:
      days:
        description: Lookback days for settled Kalshi 15m markets
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trainer tests (no look-ahead)
        run: python3 ml/test_train_edge.py
      - name: Train
        run: python3 ml/train_edge.py --days ${{ github.event.inputs.days || '30' }} --out ml/edge_model.json --manifest ml/edge_model_manifest.json
      - name: Verify model provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("ml/edge_model_manifest.json").read_text())
          assert manifest["data_source"] in {
              "kalshi_live_historical_coinbase_spot_v2",
              "kalshi_live_historical_cf_settlement_index_v3",
          }
          assert manifest["n_samples"] > 0
          assert manifest["trained_at"]
          PY
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: edge-model-json
          path: |
            ml/edge_model.json
            ml/edge_model_manifest.json
            ml/fixtures/parity_sample.json
          if-no-files-found: error
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("ml/edge_model_manifest.json")
          m = json.loads(p.read_text()) if p.is_file() else {}
          print(
              "Branch-only edge model candidate\\n\\n"
              f"- version: {m.get('version')}\\n"
              f"- trained_at: {m.get('trained_at')}\\n"
              f"- n_samples: {m.get('n_samples')}\\n"
              f"- model_brier: {m.get('model_brier')} vs market {m.get('market_brier')}\\n"
              f"- model_logloss: {m.get('model_logloss')} vs market {m.get('market_logloss')}\\n"
              f"- beats_market: {m.get('beats_market')}\\n"
              f"- promotion_eligible: {m.get('promotion_eligible')}\\n"
              f"- final_window: {m.get('final_window_model_brier')} vs market {m.get('final_window_market_brier')} "
              f"(n={m.get('final_window_samples')})"
          )
          PY
          )
          if gh release view edge-model-chat-GTP >/dev/null 2>&1; then
            gh release upload edge-model-chat-GTP \
              ml/edge_model.json \
              ml/edge_model_manifest.json \
              --clobber
            gh release edit edge-model-chat-GTP \
              --title "Edge model (chat-GTP candidate)" \
              --notes "$NOTES"
          else
            gh release create edge-model-chat-GTP \
              ml/edge_model.json \
              ml/edge_model_manifest.json \
              --target "$GITHUB_SHA" \
              --title "Edge model (chat-GTP candidate)" \
              --notes "$NOTES"
          fi
