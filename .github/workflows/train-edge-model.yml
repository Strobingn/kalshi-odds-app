name: Train edge model

# Publishes to the rolling `mis-bitcoin-edge-model` release, which this app
# (SignalConstants.EDGE_MODEL_RELEASE_TAG) downloads. `edge-model-latest`
# belongs to the main app; nothing in this file may write to it.
# Scheduled workflows only run from the default branch, and even there this
# file only ever targets RELEASE_TAG below.

on:
  # GitHub schedules only run from the default branch, so the reliable
  # retrain triggers here are pushes to this branch, manual runs, and
  # repository_dispatch (a PAT or the main-branch bridge can fire this
  # on a cron: gh api -X POST repos/{owner}/{repo}/dispatches
  #   -f event_type=retrain-mis-bitcoin --field days=270).
  push:
    branches: [Mis_bitcoin]
    paths:
      - "ml/**"
      - ".github/workflows/train-edge-model.yml"
  repository_dispatch:
    types: [retrain-mis-bitcoin]
  schedule:
    # Kept for the day Mis_bitcoin becomes the default branch. Until then
    # this cron never fires; use the repository_dispatch bridge instead.
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Lookback days for settled Kalshi 15m markets
        required: false
        default: "270"

permissions:
  contents: write

concurrency:
  group: train-edge-model-Mis_bitcoin
  cancel-in-progress: true

env:
  RELEASE_TAG: mis-bitcoin-edge-model

jobs:
  train:
    runs-on: ubuntu-latest
    # Every decision minute of every settled market in the window. 270 days
    # pulls ~30k markets through the live + historical tiers at ≤ 10 req/s
    # (~2.5h), then the L2 sweep and Newton fits (pure Python).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trainer tests (no look-ahead, offset model)
        run: python3 ml/test_train_edge.py

      - name: Restore sample cache
        id: samples
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ml/.samples-cache
          # Keyed by the sample's newest row, not the run: a cache with
          # fresher data than any previous run wins.
          key: mis-samples-v1
      - name: Train
        run: |
          python3 ml/train_edge.py \
            --days ${{ github.event.inputs.days || github.event.client_payload.days || '270' }} \
            --tag "$RELEASE_TAG" \
            --samples-cache ml/.samples-cache \
            --sweep-l2 \
            --require-live \
            --out ml/edge_model.json \
            --manifest ml/edge_model_manifest.json
      - name: Save sample cache
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ml/.samples-cache
          key: mis-samples-v1

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: edge-model-json
          path: |
            ml/edge_model.json
            ml/edge_model_manifest.json
            ml/bet_log.json
            ml/parity_sample.last.json
          if-no-files-found: error
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "mis-bitcoin-edge-model"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          NOTES=$(python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("ml/edge_model_manifest.json")
          m = json.loads(p.read_text()) if p.is_file() else {}
          print(
              "Weekly edge model (market-anchored offset logistic)\\n\\n"
              f"- version: {m.get('version')}\\n"
              f"- trained_at: {m.get('trained_at')}\\n"
              f"- n_holdout: {m.get('n_samples')}\\n"
              f"- model_brier: {m.get('model_brier')} vs market {m.get('market_brier')}\\n"
              f"- model_logloss: {m.get('model_logloss')} vs market {m.get('market_logloss')}\\n"
              f"- sim EV-at-ask trades: {m.get('sim_trades')}, P&L/contract sum: {m.get('sim_pnl')}\\n"
              f"- calibration ECE: {m.get('model_calibration_error')} vs market {m.get('market_calibration_error')}\n"
              f"- bootstrap 90% P&L CI at ask: [{m.get('boot_ci_low')}, {m.get('boot_ci_high')}], P(loss)={m.get('boot_p_of_loss')}\n"
              f"- beats_market: {m.get('beats_market')}\n"
              f"- promotion_eligible: {m.get('promotion_eligible')}"
          )
          PY
          )
          gh release create "$RELEASE_TAG" \
            ml/edge_model.json \
            ml/edge_model_manifest.json \
            ml/bet_log.json \
            --target "$GITHUB_SHA" \
            --title "Edge model (Mis_bitcoin app)" \
            --notes "$NOTES"
