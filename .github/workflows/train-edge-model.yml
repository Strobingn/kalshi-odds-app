name: Train edge model

on:
  workflow_dispatch:
    inputs:
      days:
        description: Lookback days for settled Kalshi 15m markets
        required: false
        default: "30"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train
        run: python3 ml/train_edge.py --days ${{ github.event.inputs.days || '30' }} --out ml/edge_model.json
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: edge-model-json
          path: |
            ml/edge_model.json
            ml/fixtures/parity_sample.json
          if-no-files-found: error
