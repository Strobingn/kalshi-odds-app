name: Unit tests

on:
  push:
    branches: [Claude, grokbot-claude]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Python tests (trainer + backtest parity)
        run: |
          python3 ml/test_train_edge.py
          python3 tools/backtest/test_parity.py
          python3 tools/research/test_maker_sim.py
          python3 tools/research/test_settlement.py
          python3 tools/research/test_recordings.py
          python3 tools/research/test_arb_scan.py

      - name: Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
