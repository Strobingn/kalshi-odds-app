name: Unit tests

on:
  push:
    branches: [Claude]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Python tests (trainer + backtest parity)
        run: |
          python3 ml/test_train_edge.py
          python3 tools/backtest/test_parity.py
          python3 tools/research/test_maker_sim.py
          python3 tools/research/test_pair_maker.py
          python3 tools/research/test_queue_maker.py
          python3 tools/research/test_settlement.py
          python3 tools/research/test_recordings.py
          python3 tools/research/test_arb_scan.py
          python3 tools/research/test_cloud_recorder.py
          python3 tools/research/test_options_edge.py
          python3 tools/research/test_open_study.py
          python3 tools/research/test_endgame_maker.py
          python3 tools/research/test_cross_lag.py
          python3 tools/research/test_fee_probe.py
          python3 tools/research/test_xvenue.py
          pip install -q cryptography "websockets>=14"
          python3 tools/research/test_ws.py
          pip install -q numpy pandas
          python3 tools/research/test_tape_study.py

      - name: Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
