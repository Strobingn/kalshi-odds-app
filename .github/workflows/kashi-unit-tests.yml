name: Kashi unit tests

on:
  push:
    branches: [kashi]
  pull_request:
    branches: [kashi]

permissions:
  contents: read

jobs:
  testDebugUnitTest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # cmdline-tools 16 dropped the obsolete "tools" package. The action
          # default is "tools platform-tools", which makes sdkmanager exit 1.
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: testDebugUnitTest
        run: ./gradlew testDebugUnitTest --stacktrace
