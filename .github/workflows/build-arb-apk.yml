name: Build Arb Hunter APK

on:
  push:
    branches: [Claude]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-arb-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' arbapp/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' arbapp/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Unit tests first (pure JVM scan math), then the debug APK signed with
      # the committed app/signing/diphunter-debug.jks.
      - name: Unit tests + debug APK
        run: ./gradlew :arbapp:testDebugUnitTest :arbapp:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-unit-test-reports-${{ github.run_number }}
          path: arbapp/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Rename APK
        id: apk
        run: |
          src=$(ls arbapp/build/outputs/apk/debug/*.apk | head -n1)
          out="ArbHunter-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}-${{ github.run_number }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArbHunter-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="arb-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}"
          notes="Arb Hunter v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}) from \`${{ github.ref_name }}\` @ ${GITHUB_SHA::7}, run #${{ github.run_number }}. Read-only: shows risk-free Kalshi arbitrage sets, never trades."
          # Rolling release per version + branch: move the tag to this commit.
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "Arb Hunter v${{ steps.ver.outputs.name }} (${{ github.ref_name }})" \
            --notes "$notes" \
            --prerelease
