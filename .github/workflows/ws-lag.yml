name: WebSocket lead-lag (Claude)

# Records Kalshi KXBTC15M/ETH/SOL ticker+trade and Coinbase ticker messages over
# WebSockets with one clock (tools/research/ws_recorder.py), then measures how many
# milliseconds Kalshi trails Coinbase (tools/research/ws_lag.py). Read-only: the
# Kalshi key only signs the WebSocket handshake. The key is a repository secret and
# is never printed. Needs the secrets named below (any one name per item works).

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to record"
        default: "50"
  push:
    branches: [Claude]
    paths:
      - "tools/research/ws_recorder.py"
      - "tools/research/ws_lag.py"
      - ".github/workflows/ws-lag.yml"

permissions:
  contents: read

concurrency:
  group: ws-lag
  cancel-in-progress: false

env:
  KALSHI_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID || secrets.KALSHI_KEY_ID || secrets.KALSHI_ACCESS_KEY || secrets.KALSHI_API_KEY || secrets.KALSHI_ID }}
  KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY || secrets.KALSHI_API_PRIVATE_KEY || secrets.KALSHI_PEM || secrets.KALSHI_API_SECRET || secrets.KALSHI_SECRET || secrets.KALSHI_PRIVATE_KEY_PEM }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "websockets>=14" cryptography

      - name: Tests
        run: python3 tools/research/test_ws.py

      - name: Are the secrets there? (yes/no only, never the values)
        run: |
          python3 - <<'PY'
          import os
          kid = os.environ.get("KALSHI_KEY_ID", "")
          pem = os.environ.get("KALSHI_PRIVATE_KEY", "")
          print("Kalshi key id secret found:", bool(kid.strip()), "| length", len(kid.strip()))
          print("Kalshi private key secret found:", bool(pem.strip()), "| looks like a PEM:", "PRIVATE KEY" in pem)
          if not kid.strip() or not pem.strip():
              print("Add repository secrets KALSHI_API_KEY_ID and KALSHI_PRIVATE_KEY (names tried: see the workflow file).")
          PY

      - name: Restore earlier ticks
        uses: actions/cache/restore@v4
        with:
          path: ws
          key: claude-ws-${{ github.run_id }}
          restore-keys: claude-ws-

      - name: Record
        run: |
          mkdir -p ws
          python3 tools/research/ws_recorder.py --out ws --minutes "${{ inputs.minutes || '50' }}"

      - name: Save ticks
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ws
          key: claude-ws-${{ github.run_id }}

      - name: Lead-lag
        if: always()
        run: |
          echo "===== WS LAG ====="
          python3 tools/research/ws_lag.py ws || echo "(analysis failed)"
          echo "===== END WS LAG ====="
