name: Arena replay (Claude)

# Replays the cloud recorder's days (scalper-data release) through the app's
# own PaperScalper, every strategy on its defaults, and prints each
# strategy's paper result (ArenaReplayTest). Read-only: no order, no key.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which days: cloud (scalper-data release), phone (data/phone-recordings) or both"
        type: choice
        options: [cloud, phone, both]
        default: cloud
      mode:
        description: "replay = every strategy on its defaults; sweep = small tweaks and the phone's rules; phone = the phone's rules only"
        type: choice
        options: [replay, sweep, phone]
        default: replay
  push:
    branches: [Claude]
    paths:
      - "app/src/test/java/com/dirk/kalshiodds/signal/scalper/ArenaReplayTest.kt"
      - ".github/workflows/arena-replay.yml"

permissions:
  contents: read

concurrency:
  group: arena-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Download the recordings
        env:
          GH_TOKEN: ${{ github.token }}
          # Pushes replay the cloud days; run it by hand with source=phone for the phone's days.
          SOURCE: ${{ inputs.source || 'cloud' }}
        run: |
          mkdir -p rec
          echo "source: $SOURCE"
          if [ "$SOURCE" != phone ]; then
            gh release download scalper-data -R "$GITHUB_REPOSITORY" -D rec -p 'trades_*' -p 'book_*' -p 'spot_*' -p 'settle_*'
          fi
          if [ "$SOURCE" != cloud ]; then
            cp data/phone-recordings/trades_* data/phone-recordings/book_* data/phone-recordings/spot_* data/phone-recordings/settle_* rec/
          fi
          ls -la rec

      - name: Replay
        env:
          ARENA_REPLAY_DIR: ${{ github.workspace }}/rec
          ARENA_REPLAY_OUT: ${{ github.workspace }}/arena_replay.md
          ARENA_CLEAR_LEAD_OUT: ${{ github.workspace }}/clear_lead.md
          TEST_MAX_HEAP: 6g
          ARENA_SWEEP: ${{ (inputs.mode == 'sweep' || inputs.mode == 'phone') && '1' || '' }}
          TESTS: ${{ inputs.mode == 'phone' && 'com.dirk.kalshiodds.signal.scalper.ArenaReplayTest.sweepClearLead' || 'com.dirk.kalshiodds.signal.scalper.ArenaReplayTest' }}
        run: ./gradlew :app:testDebugUnitTest --tests "$TESTS" --no-daemon --stacktrace

      - name: Report
        if: always()
        run: |
          echo "===== ARENA REPLAY ====="
          cat arena_replay.md || echo "(no report)"
          cat clear_lead.md 2>/dev/null || true
          echo "===== END ARENA REPLAY ====="
          cat arena_replay.md >> "$GITHUB_STEP_SUMMARY" || true
          cat clear_lead.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-replay
          path: |
            arena_replay.md
            clear_lead.md
          if-no-files-found: ignore
