name: BTC paper experiment ($1000 simulated)

on:
  push:
    branches: [codex/paper-lab-1000]
    paths: ['tools/paperlab/**', '.github/workflows/paper-lab.yml']
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Paper collection duration (1–60 minutes; fresh $1000 experiment)'
        default: '15'
        required: true

permissions:
  contents: read

concurrency:
  group: paper-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paper execution and accounting
        working-directory: tools/paperlab
        run: python3 -m unittest -v
      - name: Start a fresh paper account and collect public feeds
        working-directory: tools/paperlab
        env:
          REQUESTED_MINUTES: ${{ inputs.minutes || '15' }}
        run: |
          python3 -c 'import os; n=float(os.environ["REQUESTED_MINUTES"]); assert 1 <= n <= 60, "duration must be 1–60 minutes"'
          python3 paperlab.py init
          python3 paperlab.py run --minutes "$REQUESTED_MINUTES" | tee session.log
      - name: Export paper results
        if: always()
        working-directory: tools/paperlab
        run: |
          if test -f paperlab.sqlite; then
            python3 paperlab.py export > results.json
            python3 paperlab.py status >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve ledger and raw feed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-paper-${{ github.run_id }}
          path: |
            tools/paperlab/paperlab.sqlite
            tools/paperlab/results.json
            tools/paperlab/session.log
          if-no-files-found: warn
          retention-days: 30
