name: Kalshi Scalper build APK

# Builds signed APK artifacts for work branches and PRs. Successful pushes to
# kashi also publish an updater-compatible release, after every build check.
on:
  push:
    branches: [kashi-next-dev]
  pull_request:
    branches: [kashi-next-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalp-build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ML trainer tests (no look-ahead, publish safety)
        run: |
                    python3 ml/test_train_edge.py
          python3 ml/test_publish_model.py
          python3 ml/test_train_edge_0337.py
          if [ -f ml/test_train_longshot.py ]; then python3 ml/test_train_longshot.py; fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble debug APK + verify debug cert
        run: ./gradlew assembleDebug verifyDebugCert --stacktrace
      - name: Rename APK
        id: apk
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          out="KalshiScalper-v${name}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/DipHunter-debug.apk "$out"
          sha256sum "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalshiScalper-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Upload scalping UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalping-ui-previews
          path: app/build/reports/paparazzi/debug/
          if-no-files-found: error

  publish-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/kashi-next-dev'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KalshiScalper-apk
          path: update-apk
      - name: Publish the verified APK to the in-app update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          mapfile -t apks < <(find update-apk -maxdepth 1 -name '*.apk' -type f)
          [[ ${#apks[@]} == 1 ]] || { echo "Expected exactly one verified APK" >&2; exit 1; }
          cp "${apks[0]}" KalshiScalper.apk
          scripts/scalp-release.sh "scalp-v${version}" KalshiScalper.apk "$GITHUB_SHA" "Kalshi Scalper ${version}" "Kalshi Scalper ${version} (paper BTC scalping). Built and signature-checked from ${GITHUB_SHA} on kashi-next-dev."
