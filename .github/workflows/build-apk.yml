name: Build Chat Bitcoin APK

on:
  push:
    branches: [Claude, main, chat-GTP]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$((1000000 + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Debug build: signed with the committed app/signing/diphunter-debug.jks,
      # so every CI APK installs over the previous one.
      - name: Build APK and focused regressions
        run: |
          ./gradlew :app:assembleDebug :app:testDebugUnitTest \
            --tests 'com.dirk.kalshiodds.signal.v3.V3ShadowExperimentTest' \
            --tests 'com.dirk.kalshiodds.llm.PaperChatProviderTest' \
            --tests 'com.dirk.kalshiodds.llm.PaperTuningTest' \
            --tests 'com.dirk.kalshiodds.llm.PaperMarketFeedTest' \
            --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          out="Chat-Bitcoin-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}-${{ github.run_number }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Bitcoin-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="gtp-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}"
          notes="Chat Bitcoin v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}) from \`${{ github.ref_name }}\` @ ${GITHUB_SHA::7}, run #${{ github.run_number }}."
          # Rolling release per version + branch: move the tag to this commit.
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "Chat Bitcoin v${{ steps.ver.outputs.name }} (${{ github.ref_name }})" \
            --notes "$notes" \
            --prerelease
          # GitHub can leave a freshly uploaded prerelease as a draft even
          # when `release create` exits successfully. The in-app updater needs
          # the public release-by-tag endpoint, so verify it before success.
          gh release edit "$tag" --draft=false --prerelease
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
