name: Build DipHunter GTP APK

on:
  push:
    branches: [Claude, main, chat-GTP, grokbot]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Trainer tests (no look-ahead)
        run: |
          pip install 'numpy>=2,<3' 'scikit-learn>=1.7,<2'
          python3 ml/test_train_edge.py
          python3 ml/test_train_big_edge.py

      - name: Read version
        id: ver
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$((1100000 + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_KEYSTORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            umask 077
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "keystore=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets are missing (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). The APK will use the standard Android debug keystore and is not release-signed."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "keystore=" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK
        env:
          UPDATE_RELEASE_TAG: gtp-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.keystore }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            echo "Signing the APK with the release keystore from GitHub Actions secrets."
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            echo "::warning::Release signing secrets are missing. Building with the standard Android debug keystore. This APK is not release-signed."
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)
          out="DipHunter-GTP-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}-${{ github.run_number }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DipHunter-GTP-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="gtp-v${{ steps.ver.outputs.name }}-${{ github.ref_name }}"
          notes="DipHunter GTP v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}) from \`${{ github.ref_name }}\` @ ${GITHUB_SHA::7}, run #${{ github.run_number }}."
          # Rolling release per version + branch: move the tag to this commit.
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "DipHunter GTP v${{ steps.ver.outputs.name }} (${{ github.ref_name }})" \
            --notes "$notes" \
            --prerelease
          # GitHub can leave a freshly uploaded prerelease as a draft even
          # when `release create` exits successfully. The in-app updater needs
          # the public release-by-tag endpoint, so verify it before success.
          gh release edit "$tag" --draft=false --prerelease
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
