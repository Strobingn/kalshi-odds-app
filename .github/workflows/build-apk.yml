name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Trainer tests (no look-ahead)
        run: |
          pip install 'numpy>=2,<3' 'scikit-learn>=1.7,<2'
          # Optional on branches that lack these scripts.
          if [ -f ml/test_train_edge.py ]; then python3 ml/test_train_edge.py; fi
          if [ -f ml/test_train_big_edge.py ]; then python3 ml/test_train_big_edge.py; fi

      - name: Read version
        id: ver
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          # Sanitize branch for artifact/tag names (slashes → hyphens).
          branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          code=$((1000000 + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Debug build: signed with the committed app/signing debug keystore when present,
      # so each branch's APK installs over its own prior build.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Trading and update regressions
        run: |
          # Skip if this branch has no matching test classes.
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.dirk.kalshiodds.signal.AllowlistTest' \
            --tests 'com.dirk.kalshiodds.signal.TicketBuilderGateTest' \
            --tests 'com.dirk.kalshiodds.signal.trade.LiveOrderSizerTest' \
            --tests 'com.dirk.kalshiodds.signal.GuardrailsTest' \
            --tests 'com.dirk.kalshiodds.signal.feedback.ForecastUnitsTest' \
            --tests 'com.dirk.kalshiodds.prediction.ModelActivationTest' \
            --tests 'com.dirk.kalshiodds.prediction.EdgeModelTest' \
            --tests 'com.dirk.kalshiodds.signal.feedback.ForwardTestTest' \
            --tests 'com.dirk.kalshiodds.signal.feedback.ForwardTestSqliteTest' \
            --tests 'com.dirk.kalshiodds.signal.feedback.TicketForwardTestTest' \
            --tests 'com.dirk.kalshiodds.signal.feedback.TicketForwardSqliteTest' \
            --tests 'com.dirk.kalshiodds.signal.ResultsPersistenceTest' \
            --tests 'com.dirk.kalshiodds.ui.AppUpdaterTest' \
            --no-daemon --stacktrace || {
              echo "Selected regression tests missing or failed on this branch — falling back to full unit suite"
              ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
            }

      - name: Full unit suite (baseline probe)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --continue || true
      - name: Rename APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          out="DipHunter-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.branch }}-${{ github.run_number }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DipHunter-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.branch }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="apk-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.branch }}"
          notes="APK v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}) from \`${{ github.ref_name }}\` @ ${GITHUB_SHA::7}, run #${{ github.run_number }}."
          # Rolling release per version + branch: move the tag to this commit.
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "APK v${{ steps.ver.outputs.name }} (${{ github.ref_name }})" \
            --notes "$notes" \
            --prerelease
          gh release edit "$tag" --draft=false --prerelease
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
