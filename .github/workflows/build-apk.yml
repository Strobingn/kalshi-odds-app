name: Train edge model (KIMI-Bitcoin)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to train from'
        required: false
        default: 'KIMI-Bitcoin'
  push:
    branches: [KIMI-Bitcoin]
    paths:
      - 'ml/**'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'KIMI-Bitcoin' || (github.event.inputs.branch || 'KIMI-Bitcoin') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r ml/requirements.txt

      - name: Run tests
        run: python -m pytest ml/test_train_edge.py -q

      - name: Train model
        run: python ml/train_edge.py --out dist

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge-model-KIMI-Bitcoin
          name: edge-model-KIMI-Bitcoin
          prerelease: true
          files: |
            dist/edge_model.json
            dist/edge_model_manifest.json
