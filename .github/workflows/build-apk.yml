name: Build APK

on:
  push:
    branches:
      - "codex/bitcoin-edge-limit-orders-20261009"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Trainer tests (no look-ahead)
        run: |
          pip install 'numpy>=2,<3' 'scikit-learn>=1.7,<2'
          # Optional on branches that lack these scripts.
          if [ -f ml/test_train_edge.py ]; then python3 ml/test_train_edge.py; fi
          if [ -f ml/test_train_big_edge.py ]; then python3 ml/test_train_big_edge.py; fi

      - name: Read version
        id: ver
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          # Sanitize branch for artifact/tag names (slashes → hyphens).
          branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          code=$((2000000 + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Debug build: signed with the committed app/signing debug keystore when present,
      # so each branch's APK installs over its own prior build.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Trading and update regressions
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.dirk.kalshiodds.signal.trade.BitcoinEdgeTest' \
            --tests 'com.dirk.kalshiodds.signal.KalshiTradeClientTest' \
            --tests 'com.dirk.kalshiodds.signal.trade.LiveOrderSizerTest' \
            --tests 'com.dirk.kalshiodds.ui.AppUpdaterTest' \
            --tests 'com.dirk.kalshiodds.ui.AppVersionTest' \
            --no-daemon --stacktrace
          ./gradlew :app:verifyDebugCert --no-daemon

      - name: Rename APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          out="BitcoinEdge-Codex-v${{ steps.ver.outputs.name }}-${{ github.run_number }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinEdge-Codex-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.branch }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="bitcoin-edge-codex"
          notes="Bitcoin Edge v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}), commit ${GITHUB_SHA}, run ${{ github.run_number }}. Independent package com.wildlifewhisperer.bitcoinedge.codex. Experimental scalp replay, unrestricted open-contract evaluation, editable limits and order reconciliation."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$tag" --title "Bitcoin Edge v${{ steps.ver.outputs.name }} · build ${{ github.run_number }}" --notes "$notes" --prerelease
          else
            gh release create "$tag" "${{ steps.apk.outputs.path }}" --target "$GITHUB_SHA" \
              --title "Bitcoin Edge v${{ steps.ver.outputs.name }}" --notes "$notes" --prerelease
          fi
