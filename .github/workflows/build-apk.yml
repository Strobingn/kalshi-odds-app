name: Build APK (Claude ML)

# Builds DipHunter (Claude ML) — com.dirk.kalshiodds.claudeml — from this
# branch and publishes it on the rolling `claude-ml-latest` release.
on:
  push:
    branches: [claude/ml-fixes-0.3.18]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-claude-ml
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Trainer + backtest port tests
        run: |
          python3 ml/test_train_edge.py
          python3 tools/backtest/test_parity.py

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Read version
        id: ver
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Debug build signed with the committed app/signing/diphunter-debug.jks,
      # so every CI APK installs over the previous Claude ML install.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          out="DipHunter-ClaudeML-v${{ steps.ver.outputs.name }}-${{ github.run_number }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DipHunter-ClaudeML-v${{ steps.ver.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="claude-ml-latest"
          notes="DipHunter (Claude ML) v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }}), package com.dirk.kalshiodds.claudeml, from \`${{ github.ref_name }}\` @ ${GITHUB_SHA::7}, run #${{ github.run_number }}."
          # Rolling release: move the tag to this commit.
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "DipHunter (Claude ML) v${{ steps.ver.outputs.name }}" \
            --notes "$notes" \
            --prerelease
