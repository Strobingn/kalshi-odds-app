name: Cloud recorder (Claude)

# Records Kalshi 15m crypto books/trades/settlements + Coinbase spot at ~1 s
# (tools/research/cloud_recorder.py, same format as the phone's recorder),
# keeps them in the Actions cache (key claude-recordings-*) and copies each day into the
# "scalper-data" release, then reruns the lag and
# maker studies on everything recorded so far. Each run re-dispatches itself,
# so recording continues back to back until a run is started with chain=false.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to record this run"
        default: "330"
      chain:
        description: "Start the next run when this one ends"
        default: "true"
  push:
    branches: [Claude]
    paths:
      - "tools/research/cloud_recorder.py"
      - ".github/workflows/record.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-recorder
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python3 tools/research/test_cloud_recorder.py
          python3 tools/research/test_recordings.py

      - name: Restore earlier recordings
        uses: actions/cache/restore@v4
        with:
          path: rec
          key: claude-recordings-${{ github.run_id }}
          restore-keys: claude-recordings-

      - name: Show recordings so far
        run: mkdir -p rec && ls -la rec | tail -n 20

      - name: Record
        run: python3 tools/research/cloud_recorder.py --out rec --minutes "${{ inputs.minutes || '330' }}"

      - name: Save recordings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rec
          key: claude-recordings-${{ github.run_id }}

      # Permanent, downloadable copy: the days this run wrote go into the
      # "scalper-data" release (no APK in it, so the app's updater ignores it).
      - name: Copy this run's days into the scalper-data release
        if: always()
        run: |
          tag=scalper-data
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_REF_NAME" --prerelease \
              --title "Scalper data (recordings and study files)" \
              --notes "Data only, no app. Cloud recorder files, one per UTC day. Format: tools/research/recordings.py."
          fi
          mapfile -t files < <(find rec -maxdepth 1 -type f \( -name '*.csv.gz' -o -name '*.csv' \) -mmin -420)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$tag" "${files[@]}" --clobber || echo "(release upload failed)"
          fi

      - name: Lag study + maker sim
        if: always()
        run: |
          echo "===== LAG STUDY ====="
          python3 tools/research/lag_study.py rec || echo "(lag study failed)"
          echo "===== END LAG STUDY ====="
          echo "===== MAKER SIM ====="
          python3 tools/research/maker_sim.py --dir rec --series BTC --iters 1000 || echo "(maker sim failed)"
          echo "===== END MAKER SIM ====="
          for coin in ETH SOL; do
            echo "===== MAKER SIM $coin ====="
            python3 tools/research/maker_sim.py --dir rec --series "$coin" --iters 1000 || echo "(maker sim $coin failed)"
            echo "===== END MAKER SIM $coin ====="
          done

      - name: Start the next run
        if: ${{ !cancelled() && (inputs.chain || 'true') == 'true' }}
        run: gh workflow run record.yml --ref "$GITHUB_REF_NAME" -f minutes=330 -f chain=true
